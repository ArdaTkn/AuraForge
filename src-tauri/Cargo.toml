[package]
name = "auraforge"
version = "0.3.1"
description = "AuraForge — real-time parametric generative art studio"
authors = ["Arda Tekin"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "auraforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
